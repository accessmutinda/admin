name: Deploy admin

on:
  push:
    branches: [main, development]
    paths-ignore:
      - "**/*.md"
      - ".vscode/**"
  workflow_dispatch:

concurrency:
  group: deploy-admin-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish ${{ github.ref_name == 'main' && 'production' || 'live' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build -- --configuration production

      - name: Choose the site
        id: site
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "path=/var/www/admin/" >> "$GITHUB_OUTPUT"
            echo "url=https://admin.neuraledge.co.ke" >> "$GITHUB_OUTPUT"
          else
            echo "path=/var/www/live/" >> "$GITHUB_OUTPUT"
            echo "url=https://live.neuraledge.co.ke" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "Set DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS in repository secrets."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sync dist to the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ steps.site.outputs.path }}
          DEPLOY_URL: ${{ steps.site.outputs.url }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ]; then
            echo "Set DEPLOY_HOST and DEPLOY_USER in repository secrets."
            exit 1
          fi
          test -f dist/admin/browser/index.html
          port="${DEPLOY_PORT:-22}"
          echo "Publishing to ${DEPLOY_URL}"
          rsync -rlz --delete --omit-dir-times --chmod=D755,F644 \
            -e "ssh -i $HOME/.ssh/deploy_key -p ${port} -o IdentitiesOnly=yes" \
            dist/admin/browser/ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}"
