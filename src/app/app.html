<cv-session-timeout />
<div
  class="app-route-content"
  [hidden]="!ready() || !!navigation.rootDestination()"
  [attr.inert]="!ready() || navigation.rootDestination() ? '' : null"
>
  <router-outlet />
</div>
@if (ready() && navigation.rootDestination(); as destination) {
  <cv-page-transition [url]="destination" />
}
@if (!ready()) {
  <cv-page-transition [url]="initialPath" />
}
@if (failed()) {
  <div role="alert" class="p-6">
    <p>This page could not be loaded.</p>
    <button type="button" (click)="retry()">Retry</button>
  </div>
}
