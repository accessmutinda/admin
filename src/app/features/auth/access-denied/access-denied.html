<cv-auth-centered-layout width="md">
  <span
    aria-hidden="true"
    class="mb-5 inline-flex h-12 w-12 items-center justify-center rounded-xl border border-error/20 bg-error-50 text-error"
  >
    <span class="material-symbols-outlined text-[24px]">lock</span>
  </span>
  <h1 class="cv-auth-heading">Access restricted</h1>
  <p class="mt-3 text-sm leading-6 text-slate">
    Your account doesn't have permission to access this area.
  </p>
  @if (requiredRoleLabels.length) {
    <div class="mt-6 rounded-xl border border-error/20 bg-error-50 p-4 text-sm">
      <p class="flex items-center gap-2 font-medium text-ink">
        <span aria-hidden="true" class="material-symbols-outlined text-[18px] text-error"
          >warning</span
        >
        Required permission
      </p>
      <p class="mt-2 leading-6 text-slate">
        This area is available to {{ requiredRoleLabels.join(', ') }}.
      </p>
    </div>
  }
  <div class="mt-7 flex flex-col gap-3">
    <button mat-flat-button type="button" class="cv-auth-primary" (click)="goToDashboard()">
      {{ isSignedIn ? 'Go to your dashboard' : 'Back to sign in' }}
    </button>
    <a
      mat-stroked-button
      href="mailto:support@careverity.com?subject=Access%20request"
      class="cv-auth-secondary"
      >Request access</a
    >
  </div>
</cv-auth-centered-layout>
