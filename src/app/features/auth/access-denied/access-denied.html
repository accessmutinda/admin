<cv-auth-centered-layout width="md">
  <span class="cv-auth-mark cv-auth-mark-neutral" aria-hidden="true"
    ><span class="material-symbols-outlined">lock</span></span
  >
  <h1 class="cv-auth-heading">Access restricted</h1>
  <p class="mt-3 text-sm leading-6 text-slate">
    Your account doesn't have permission to access this area. Your organisation’s admin can help you
    check your access.
  </p>
  @if (requiredRoleLabels.length) {
    <div class="mt-6 rounded-xl border border-line bg-cloud p-4 text-sm">
      <p class="flex items-center gap-2 font-medium text-ink">
        <span aria-hidden="true" class="material-symbols-outlined text-[18px] text-slate"
          >warning</span
        >
        Required permission
      </p>
      <p class="mt-2 leading-6 text-slate">
        This area is available to {{ requiredRoleLabels.join(', ') }}.
      </p>
    </div>
  }
  <div class="mt-5 flex flex-col gap-3">
    <button mat-flat-button type="button" class="cv-auth-primary" (click)="goToDashboard()">
      {{ isSignedIn ? 'Go to security settings' : 'Back to sign in' }}
    </button>
    <a
      mat-stroked-button
      href="mailto:support@careverity.com?subject=Access%20request"
      class="cv-auth-secondary"
      >Request access</a
    >
  </div>
</cv-auth-centered-layout>
