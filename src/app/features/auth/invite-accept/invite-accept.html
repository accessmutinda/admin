<cv-auth-centered-layout width="md">
  <h1 class="cv-auth-heading">Join your care team</h1>
  <p class="mt-3 text-sm text-slate">
    Sign in with the email address that received this invitation, then accept to join your company.
  </p>
  @if (errorMessage()) {
    <div class="mt-4" role="alert">
      <cv-alert tone="error">{{ errorMessage() }}</cv-alert>
    </div>
  }
  @if (auth.isAuthenticated()) {
    <p class="mt-4 text-sm">Signed in as {{ auth.currentUser()?.email }}</p>
    <button
      mat-flat-button
      type="button"
      class="cv-auth-primary !mt-5 !w-full"
      [disabled]="loading()"
      (click)="accept()"
    >
      @if (loading()) {
        <cv-skeleton sizeClass="mr-2 h-3 w-8 !bg-white/30" />
      }
      {{ loading() ? 'Joining…' : 'Accept invitation' }}
    </button>
  } @else {
    <a
      [routerLink]="auth.nextRoute()"
      [queryParams]="{ redirectTo: returnTo }"
      class="cv-auth-link cv-auth-text-action mt-5"
      >Sign in to continue</a
    >
  }
</cv-auth-centered-layout>
