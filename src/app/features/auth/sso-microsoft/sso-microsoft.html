<div class="flex min-h-screen w-full flex-col lg:flex-row">
  <main class="flex w-full flex-1 items-center justify-center bg-white px-6 py-12 sm:px-10 lg:w-1/2">
    <div class="cv-enter w-full max-w-sm">
      <cv-logo size="lg" />

      <p class="mt-7 text-xs font-semibold uppercase tracking-[0.1em] text-teal">Single sign-on</p>
      <h1 class="mt-2 text-2xl font-bold tracking-tight text-ink sm:text-3xl">Sign in with Microsoft</h1>
      <p class="mt-1.5 text-sm text-slate">Use your organisation's Microsoft account to access CareVerity.</p>

      <ul class="mt-6 space-y-3 text-sm text-ink">
        @for (item of benefits; track item) {
          <li class="flex items-center gap-2.5">
            <span class="material-symbols-outlined text-[18px] text-success">check_circle</span>
            {{ item }}
          </li>
        }
      </ul>

      <button
        mat-flat-button
        color="primary"
        type="button"
        class="!mt-7 !h-11 !w-full !rounded-lg !bg-gradient-to-b !from-teal !to-teal-600 !text-base !shadow-card !transition-all !duration-150 hover:!shadow-card-hover active:!scale-[0.98]"
        [disabled]="loading()"
        (click)="continueWithMicrosoft()"
      >
        <span class="flex items-center justify-center gap-2">
          <svg viewBox="0 0 21 21" class="h-4 w-4">
            <rect x="1" y="1" width="9" height="9" fill="#f25022" />
            <rect x="11" y="1" width="9" height="9" fill="#7fba00" />
            <rect x="1" y="11" width="9" height="9" fill="#00a4ef" />
            <rect x="11" y="11" width="9" height="9" fill="#ffb900" />
          </svg>
          {{ loading() ? 'Redirecting…' : 'Continue with Microsoft' }}
        </span>
      </button>

      <p class="mt-6 text-center text-sm">
        <a
          routerLink="/auth/sign-in"
          class="font-medium text-teal transition-colors hover:text-teal-600 hover:underline"
          >Back to sign in</a
        >
      </p>
    </div>
  </main>

  <aside class="relative hidden w-1/2 flex-col items-center justify-center gap-6 overflow-hidden bg-navy lg:flex">
    <div
      class="pointer-events-none absolute inset-0 opacity-60 [background-image:radial-gradient(1px_1px_at_1px_1px,rgba(255,255,255,0.08)_1px,transparent_0)] [background-size:22px_22px]"
    ></div>
    <div class="pointer-events-none absolute -right-20 -top-20 h-80 w-80 rounded-full bg-teal/10 blur-3xl"></div>
    <div
      class="pointer-events-none absolute -bottom-24 -left-16 h-72 w-72 rounded-full bg-brand-blue/10 blur-3xl"
    ></div>

    <div class="relative z-10 flex items-center gap-4">
      <span class="flex h-16 w-16 items-center justify-center rounded-2xl bg-white shadow-float">
        <svg viewBox="0 0 21 21" class="h-8 w-8">
          <rect x="1" y="1" width="9" height="9" fill="#f25022" />
          <rect x="11" y="1" width="9" height="9" fill="#7fba00" />
          <rect x="1" y="11" width="9" height="9" fill="#00a4ef" />
          <rect x="11" y="11" width="9" height="9" fill="#ffb900" />
        </svg>
      </span>
      <span class="material-symbols-outlined text-[28px] text-white/40">sync_alt</span>
      <cv-logo tone="light" size="lg" />
    </div>
    <p class="relative z-10 max-w-xs text-center text-lg font-semibold tracking-tight text-white">
      One account.<br />A more secure way to care.
    </p>
  </aside>
</div>
