<cv-auth-split-layout>
  <h1 class="cv-auth-heading">Sign in with Microsoft</h1>
  <p class="mt-3 text-sm leading-6 text-slate">
    Continue with your organisation's Microsoft account to access your CareVerity workspace.
  </p>
  <ul class="mt-6 space-y-3 text-sm text-ink">
    @for (item of benefits; track item) {
      <li class="flex items-start gap-2.5">
        <span
          aria-hidden="true"
          class="material-symbols-outlined mt-0.5 shrink-0 text-[18px] text-teal-600"
          >check_circle</span
        >
        <span>{{ item }}</span>
      </li>
    }
  </ul>
  <button
    mat-flat-button
    type="button"
    class="cv-auth-primary !mt-8 !w-full"
    [disabled]="loading()"
    (click)="continueWithMicrosoft()"
  >
    <span class="flex items-center justify-center gap-2.5">
      <svg aria-hidden="true" viewBox="0 0 21 21" class="h-4 w-4">
        <rect x="1" y="1" width="9" height="9" fill="#f25022" />
        <rect x="11" y="1" width="9" height="9" fill="#7fba00" />
        <rect x="1" y="11" width="9" height="9" fill="#00a4ef" />
        <rect x="11" y="11" width="9" height="9" fill="#ffb900" />
      </svg>
      {{ loading() ? 'Redirecting…' : 'Continue with Microsoft' }}
    </span>
  </button>
  <p class="mt-6 text-center text-sm">
    <a routerLink="/auth/sign-in" class="cv-auth-link">Back to sign in</a>
  </p>
</cv-auth-split-layout>
