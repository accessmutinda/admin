<cv-auth-centered-layout>
  <div class="flex flex-col items-center text-center">
    <span class="text-5xl font-bold tracking-tight text-line">404</span>
    <h1 class="mt-3 text-2xl font-bold tracking-tight text-ink sm:text-3xl">Page not found</h1>
    <p class="mt-1.5 text-sm text-slate">The page you're looking for doesn't exist or may have moved.</p>
  </div>

  <button
    mat-flat-button
    color="primary"
    type="button"
    class="!mt-6 !h-11 !w-full !rounded-lg !bg-gradient-to-b !from-teal !to-teal-600 !text-base !shadow-card !transition-all !duration-150 hover:!shadow-card-hover active:!scale-[0.98]"
    (click)="goHome()"
  >
    Take me home
  </button>
</cv-auth-centered-layout>
