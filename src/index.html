<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CareVerit Dashboard</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f2d4a" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root>
      <div class="cv-boot" role="status" aria-label="Loading CareVerity" aria-busy="true">
        <div class="cv-boot-card">
          <img src="/brand/logo-full.png" alt="CareVerity" width="132" />
          <div class="cv-boot-line cv-boot-title"></div>
          <div class="cv-boot-line"></div>
          <div class="cv-boot-line cv-boot-field"></div>
          <div class="cv-boot-line cv-boot-field"></div>
          <div class="cv-boot-line cv-boot-field"></div>
        </div>
      </div>
      <style>
        .cv-boot {
          display: grid;
          place-items: center;
          min-height: 100svh;
          padding: 24px;
          background: #f3f6f9;
          box-sizing: border-box;
        }
        .cv-boot-card {
          width: 100%;
          max-width: 432px;
          padding: 32px;
          background: white;
          border: 1px solid #e1e7ed;
          border-radius: 20px;
          box-sizing: border-box;
        }
        .cv-boot-card img {
          height: auto;
          margin-bottom: 32px;
        }
        .cv-boot-line {
          height: 12px;
          margin: 16px 0;
          background: #e5e7eb;
          border-radius: 7px;
          animation: cv-boot-pulse 1.5s ease-in-out infinite;
        }
        .cv-boot-title {
          height: 28px;
          width: 65%;
        }
        .cv-boot-field {
          height: 48px;
          margin-top: 24px;
        }
        @keyframes cv-boot-pulse {
          50% {
            opacity: 0.45;
          }
        }
        @media (prefers-reduced-motion: reduce) {
          .cv-boot-line {
            animation: none;
          }
        }
        @media (max-width: 599px) {
          .cv-boot {
            padding: 0;
            background: white;
            align-items: start;
          }
          .cv-boot-card {
            border: 0;
            border-radius: 0;
            max-width: none;
            padding: 24px;
          }
        }
      </style>
    </app-root>
  </body>
</html>
